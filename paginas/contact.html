<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacto | Mi Portafolio</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>

  <body>
    <header class="bg-light border-bottom">
      <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container">
          <a class="navbar-brand d-flex align-items-center" href="../index.html">
            <img
              src="../img/foto1.jpeg"
              alt="Logotipo de ChristianDev"
              width="48"
              height="48"
              class="rounded-circle me-2"
            />
            <span>ChristianDev</span>
          </a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menuPrincipal"
            aria-controls="menuPrincipal"
            aria-expanded="false"
            aria-label="Mostrar navegación"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav">
              <li class="nav-item"><a class="nav-link" href="../index.html">Inicio</a></li>
              <li class="nav-item"><a class="nav-link" href="proyectos.html">Proyectos</a></li>
              <li class="nav-item"><a class="nav-link" href="info.html">Información</a></li>
              <li class="nav-item"><a class="nav-link active" aria-current="page" href="contact.html">Contacto</a></li>
              <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <hr />

    <main class="container py-4">
      <section>
        <p><strong>Hablemos</strong></p>
        <h2>Ponte en contacto conmigo.</h2>
        <p>
          Completa el formulario si deseas consultar sobre un proyecto, una
          colaboración o resolver alguna duda.
        </p>
      </section>

      <hr />

      <section>
        <h3>Formulario de contacto</h3>

        <!-- Agregamos id="form-contacto" -->
        <form id="form-contacto">
          <p>
            <label for="nombre">Nombre completo:</label><br />
            <input
              type="text"
              id="nombre"
              name="nombre"
              placeholder="Escribe tu nombre"
              required
            />
          </p>

          <p>
            <label for="correo">Correo electrónico:</label><br />
            <input
              type="email"
              id="correo"
              name="correo"
              placeholder="correo@ejemplo.com"
              required
            />
          </p>

          <p>
            <label for="asunto">Tipo de consulta:</label><br />
            <select id="asunto" name="asunto">
              <option value="proyecto-web">Proyecto web</option>
              <option value="diseno-ux-ui">Diseño / UX-UI</option>
              <option value="colaboracion">Colaboración</option>
              <option value="otro">Otro</option>
            </select>
          </p>

          <p>
            <label for="mensaje">Mensaje:</label><br />
            <textarea
              id="mensaje"
              name="mensaje"
              rows="5"
              cols="35"
              placeholder="Cuéntame los detalles de tu idea..."
              required
            ></textarea>
          </p>

          <p>
            <button type="submit">Enviar mensaje</button>
          </p>

          <!-- Aquí aparecerá el mensaje de confirmación o error -->
          <p id="estado-formulario"></p>
        </form>
      </section>
    </main>

    <hr />

    <footer>
      <p>© 2026 ChristianDev</p>
    </footer>

    <!-- Enlace al archivo JavaScript -->
    <script src="../js/contacto.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
